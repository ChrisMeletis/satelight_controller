[env:nodemcu]
platform = espressif8266
board = nodemcu
framework = arduino
lib_deps = 
	adafruit/Adafruit NeoPixel@^1.12.4
	enjoyneering/AHT10@^1.1.0
	sparkfun/SparkFun Ambient Light Sensor Arduino Library@^1.0.4
