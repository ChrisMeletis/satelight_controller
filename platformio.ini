; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_command = /home/chris/.platformio/penv/bin/python /home/chris/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32 --port $UPLOAD_PORT --baud $UPLOAD_SPEED --before no_reset --after hard_reset write_flash -z 0x10000 .pio/build/esp32dev/firmware.bin
; upload_command = /home/chris/.platformio/penv/bin/python /home/chris/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32 --port $UPLOAD_PORT --baud $UPLOAD_SPEED --before no_reset --after hard_reset write_flash -z --flash_mode dio --flash_freq 40m --flash_size detect 0x1000 .pio/build/esp32dev/bootloader.bin 0x8000 .pio/build/esp32dev/partitions.bin 0x10000 .pio/build/esp32dev/firmware.bin

lib_deps = 
	adafruit/Adafruit NeoPixel@^1.12.4
	enjoyneering/AHT10@^1.1.0
	sparkfun/SparkFun Ambient Light Sensor Arduino Library@^1.0.4
	sstaub/Ticker@^4.4.0
